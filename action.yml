name: 'Testpilot'
description: 'AI-reasoned CI test selection — explainable, self-hostable, works with zero setup. Built on Mastra.'
author: 'athul-2003'
branding:
  icon: 'check-circle'
  color: 'blue'

# A thin wrapper, deliberately with no logic of its own (decision D6) — every
# input here maps directly onto the CLI's own flags and environment
# variables, so the engine's behavior is identical whether it's invoked
# locally, from Studio, or from this Action.

inputs:
  repo-root:
    description: 'Path to the repository to analyse.'
    required: false
    default: ${{ github.workspace }}
  base:
    description: 'Branch to diff against.'
    required: false
    default: ${{ github.base_ref }}
  model:
    description: 'Everyday reasoning model, as a "provider/model" string. Leave unset to use the default (a small, cheap model).'
    required: false
  groq-api-key:
    description: 'Groq API key. Provide this or openai-api-key (or point `model` at a self-hosted endpoint) — at least one working model provider is required.'
    required: false
  openai-api-key:
    description: 'OpenAI API key, used for critical/ambiguous reasoning calls.'
    required: false
  github-token:
    description: 'Token used to post the PR comment. Needs pull-requests:write and issues:write.'
    required: false
    default: ${{ github.token }}
  post-comment:
    description: 'Whether to post the report as a PR comment.'
    required: false
    default: 'true'

outputs:
  report:
    description: 'The rendered Markdown report.'
    value: ${{ steps.run.outputs.report }}
  confidence:
    description: "Testpilot's confidence in this run's selection (0–1)."
    value: ${{ steps.run.outputs.confidence }}

runs:
  using: 'composite'
  steps:
    - name: Install Testpilot's own dependencies
      shell: bash
      # github.action_path is where GitHub checks out THIS repo's contents
      # at the ref the caller pinned — no npm publish required for the
      # Action itself to work, since Actions distribute via git tag, not
      # the npm registry.
      run: npm ci --prefix "${{ github.action_path }}"

    - name: Run Testpilot
      id: run
      shell: bash
      env:
        GROQ_API_KEY: ${{ inputs.groq-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        TESTPILOT_MODEL: ${{ inputs.model }}
      run: |
        node "${{ github.action_path }}/src/cli.ts" \
          --repo-root "${{ inputs.repo-root }}" \
          --base "${{ inputs.base }}" \
          --json \
          --out testpilot-result.json

        CONFIDENCE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('testpilot-result.json','utf8')).confidence)")
        echo "confidence=$CONFIDENCE" >> "$GITHUB_OUTPUT"

        node -e "console.log(JSON.parse(require('fs').readFileSync('testpilot-result.json','utf8')).report)" > testpilot-report.md

        {
          echo "report<<TESTPILOT_REPORT_EOF"
          cat testpilot-report.md
          echo "TESTPILOT_REPORT_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Post PR comment
      if: ${{ inputs.post-comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('testpilot-report.md', 'utf8');
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: report,
          });
